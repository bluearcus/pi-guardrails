name: Upstream sync

# Notifies the fork owner when the upstream repository publishes commits that
# this fork has not merged. Opens one issue and keeps updating it.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: aliou/pi-guardrails
      UPSTREAM_BRANCH: main
      LABEL: upstream-sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Count unmerged upstream commits
        id: behind
        run: |
          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then
            echo "Fork is current with upstream/${UPSTREAM_BRANCH}."
            exit 0
          fi
          {
            echo "commits<<'EOF'"
            git log --pretty=format:'- `%h` %s (%an, %ad)' --date=short \
              "HEAD..upstream/${UPSTREAM_BRANCH}"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: steps.behind.outputs.behind != '0'
        name: Open or update the sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.behind.outputs.behind }}
          COMMITS: ${{ steps.behind.outputs.commits }}
        run: |
          gh label create "$LABEL" --description "Upstream commits to merge" --exists-ok
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
            --state open --json number --jq '.[0].number // empty')
          body="Upstream \`${UPSTREAM_REPO}\` has ${BEHIND} commit(s) this fork has not merged.

          ${COMMITS}

          Merge with:

          \`\`\`sh
          git fetch upstream
          git merge upstream/${UPSTREAM_BRANCH}
          \`\`\`
          "
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$LABEL" \
              --title "Upstream is ${BEHIND} commit(s) ahead" --body "$body"
          fi
